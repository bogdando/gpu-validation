---
- name: Setup
  become: true
  ansible.builtin.import_tasks: setup.yaml

- name: Reboot if system updates require it
  ansible.builtin.import_tasks: reboot_if_needed.yaml

- name: Check GPUs
  ansible.builtin.import_tasks: gpus.yaml

- name: Nvidia Setup (Use the edpm_accel_drivers role to install the NVIDIA driver in our VM)
  ansible.builtin.include_role:
    name: osp.edpm.edpm_accel_drivers
  when: gpu_validation_vendor_name | upper == "NVIDIA" and gpu_validation_found[gpu_validation_vendor_name] | bool

- name: Reboot if system updates require it
  ansible.builtin.import_tasks: reboot_if_needed.yaml

- name: Install NVIDIA CUDA repos
  ansible.builtin.import_tasks: nvidia-cuda-repos.yaml
  when:
    - ansible_distribution == "RedHat"
    - gpu_validation_mode == "mig"

- name: Install NVIDIA container toolkit and configure runtime
  ansible.builtin.import_tasks: nvidia-container-toolkit.yaml

- name: GPUs Assertions
  ansible.builtin.import_tasks: gpus_assertions.yaml

- name: Check NVIDIA
  ansible.builtin.import_tasks: nvidia.yaml

- name: NVIDIA assertions
  ansible.builtin.import_tasks: nvidia_assertions.yaml

- name: Generate NVIDIA CDI configuration
  ansible.builtin.import_tasks: nvidia-cdi.yaml

- name: Check CUDA libs
  ansible.builtin.import_tasks: cuda.yaml

- name: CUDA Assertions
  ansible.builtin.import_tasks: cuda_assertions.yaml

- name: Allow container GPU device access under SELinux
  ansible.builtin.import_tasks: selinux-gpu-access.yaml

- name: Check vllm (ignore errors)  # noqa: ignore-errors
  ansible.builtin.import_tasks: vllm.yaml
  when: gpu_validation_model_tests_enabled | bool
  ignore_errors: true

- name: Cleanup
  become: true
  ansible.builtin.import_tasks: cleanup.yaml
