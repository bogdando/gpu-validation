---
# Mode 2 (FABRIC_MODE=2) host-side assertions.
# Verifies FM + nvidia-vgpu-mgr are active, all GPUs completed, mdev instances
# exist, and exactly one mdev instance is parented per GPU PF BDF.

- name: Assert FM services are active (mode 2)
  ansible.builtin.assert:
    that:
      - item[1] == 'active'
    fail_msg: "Service {{ item[0] }} is not active (state: {{ item[1] }})"
    success_msg: "Service {{ item[0] }} is active"
  loop: "{{ gpu_validation_nvswitch_fm_service_results }}"

- name: Assert all GPUs reached Fabric State Completed
  ansible.builtin.assert:
    that:
      - gpu_validation_nvswitch_fabric_states | length == gpu_validation_nvswitch_validation_expected_gpu_count | int
      - gpu_validation_nvswitch_fabric_completed_count | int == gpu_validation_nvswitch_validation_expected_gpu_count | int
    fail_msg: >-
      Discovered {{ gpu_validation_nvswitch_fabric_states | length }} GPU(s), expected {{ gpu_validation_nvswitch_validation_expected_gpu_count }}.
      Only {{ gpu_validation_nvswitch_fabric_completed_count }} of
      {{ gpu_validation_nvswitch_validation_expected_gpu_count }} GPUs reached
      Fabric State: {{ gpu_validation_nvswitch_validation_fabric_state_expected }}.
      States seen: {{ gpu_validation_nvswitch_fabric_states }}
    success_msg: >-
      All {{ gpu_validation_nvswitch_validation_expected_gpu_count }} GPUs reached
      Fabric State: {{ gpu_validation_nvswitch_validation_fabric_state_expected }}
  when: gpu_validation_nvswitch_validation_fabric_state_check | bool

- name: Assert expected number of mdev instances exist
  ansible.builtin.assert:
    that:
      - gpu_validation_nvswitch_mdev_instance_count | int == gpu_validation_nvswitch_validation_mode2_expected_mdev_count | int
    fail_msg: >-
      mdevctl list shows {{ gpu_validation_nvswitch_mdev_instance_count }} mdev instance(s),
      expected {{ gpu_validation_nvswitch_validation_mode2_expected_mdev_count }}.
      Full mdevctl output:
      {{ gpu_validation_nvswitch_mdevctl_output }}
    success_msg: >-
      All {{ gpu_validation_nvswitch_validation_mode2_expected_mdev_count }} mdev instance(s) found
  when: gpu_validation_nvswitch_validation_mode2_expected_mdev_count | int > 0

- name: Assert exactly one mdev instance per GPU PF BDF
  ansible.builtin.assert:
    that:
      - gpu_validation_nvswitch_mdev_parent_bdfs | length == gpu_validation_nvswitch_mdev_instance_count | int
      - gpu_validation_nvswitch_mdev_parent_bdfs | unique | length == gpu_validation_nvswitch_mdev_parent_bdfs | length
    fail_msg: >-
      Expected exactly one mdev instance per GPU PF BDF, but mdevctl list shows
      {{ gpu_validation_nvswitch_mdev_instance_count }} instance(s) parented by
      {{ gpu_validation_nvswitch_mdev_parent_bdfs | unique | length }} distinct PF(s).
      Parsed parent PF BDFs (one entry per instance — a BDF listed more than once
      means its PF hosts multiple mdev instances, fewer entries than instances
      means an unparsable mdevctl line):
      {{ gpu_validation_nvswitch_mdev_parent_bdfs | sort }}.
      Full mdevctl output:
      {{ gpu_validation_nvswitch_mdevctl_output }}
    success_msg: >-
      Exactly one mdev instance per GPU PF BDF — {{ gpu_validation_nvswitch_mdev_instance_count }}
      instance(s) across {{ gpu_validation_nvswitch_mdev_parent_bdfs | unique | length }} distinct PF(s)
  when: gpu_validation_nvswitch_validation_mode2_expected_mdev_count | int > 0
